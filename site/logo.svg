<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-label="RSMotoCons logo">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e5ac8"/>
      <stop offset="1" stop-color="#4b8ef0"/>
    </linearGradient>
  </defs>
  <!-- Gauge emblem with Frecce Tricolori smoke-trail arcs -->
  <g transform="translate(70,70)">
    <circle r="58" fill="none" stroke="#aeb9c4" stroke-width="7"/>
    <!-- tricolore trails sweeping like the smoke of the formation -->
    <path d="M -43.1 21.55 A 48.2 48.2 0 1 1 43.1 21.55" fill="none" stroke="#009246" stroke-width="7" stroke-linecap="round"/>
    <path d="M -34.1 17.05 A 38.1 38.1 0 1 1 34.1 17.05" fill="none" stroke="#f4f7fa" stroke-width="7" stroke-linecap="round"/>
    <path d="M -25 12.5 A 28 28 0 1 1 25 12.5" fill="none" stroke="#ce2b37" stroke-width="7" stroke-linecap="round"/>
    <!-- needle pointing high, in livery blue -->
    <g>
      <line x1="0" y1="0" x2="24" y2="-24" stroke="url(#blueGrad)" stroke-width="5.5" stroke-linecap="round"/>
      <circle r="7" fill="#2f6fd6"/>
      <circle r="3" fill="#0b1017"/>
    </g>
  </g>
  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="150" y="76" font-size="52" font-weight="800" letter-spacing="1" fill="#eef3f8">RS<tspan fill="#4b8ef0">Moto</tspan>Cons</text>
    <!-- tricolore underline stripe -->
    <g transform="translate(153,88)">
      <rect x="0" y="0" width="120" height="6" rx="3" fill="#009246"/>
      <rect x="124" y="0" width="120" height="6" rx="3" fill="#f4f7fa"/>
      <rect x="248" y="0" width="120" height="6" rx="3" fill="#ce2b37"/>
    </g>
    <text x="153" y="116" font-size="15" font-weight="600" letter-spacing="6" fill="#8fa3b8">DEALERSHIP OPERATIONS TOOLS</text>
  </g>
</svg>
