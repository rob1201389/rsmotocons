name: Deploy to Cloudflare

# Pushing to main publishes the site and the trade plate app.
#
# Before this worked, a push to GitHub changed nothing on rsmotocons.com —
# the live worker was only ever updated by running wrangler by hand.
#
# "Run workflow" on the Actions tab deploys the current main without needing
# a commit, which is the button to use if you just want to re-publish.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "setup/**"
  workflow_dispatch:
    inputs:
      reset_gym_owner:
        description: "Delete the gym owner account so it is recreated from the repo secrets (only if it is the only account)"
        type: boolean
        default: false

# Never let two deploys race. A queued one waits rather than overtaking.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails the run before touching production if the config is malformed.
      - name: Check the config builds
        run: npx --yes wrangler@4 deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Recomp gym app at gym.rsmotocons.com: its own worker, config in gym/.
      # The API token needs permission to create the custom domain (Workers
      # Scripts edit plus DNS edit on the rsmotocons.com zone) on first run.
      - name: Deploy gym app
        working-directory: gym
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Idempotent (CREATE TABLE IF NOT EXISTS), so safe on every deploy.
      - name: Gym app database tables
        working-directory: gym
        run: npx --yes wrangler@4 d1 execute DB --remote --file=backend/schema.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Off by default. Ticked by hand on "Run workflow" when the owner password
      # is lost before anyone has used the app. Refuses if there is more than
      # one account. The owner then sets a new password in the app.
      - name: Gym app owner reset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_gym_owner }}
        working-directory: gym
        run: >
          npx --yes wrangler@4 d1 execute DB --remote --command
          "DELETE FROM users WHERE role = 'owner' AND (SELECT COUNT(*) FROM users) = 1;
          DELETE FROM meta WHERE key = 'bootstrap_done' AND (SELECT COUNT(*) FROM users) = 0;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The owner chooses their own password in the app the first time; only
      # their email is configured here. Skipped until GYM_OWNER_EMAIL exists.
      - name: Gym app owner email
        working-directory: gym
        run: |
          if [ -z "$GYM_OWNER_EMAIL" ]; then
            echo "GYM_OWNER_EMAIL not set; skipping."; exit 0
          fi
          printf '%s' "$GYM_OWNER_EMAIL" | npx --yes wrangler@4 secret put OWNER_EMAIL
        env:
          GYM_OWNER_EMAIL: ${{ secrets.GYM_OWNER_EMAIL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Worth knowing: `wrangler deploy` does not touch secrets. DATA_KEY,
      # SESSION_SECRET, DRIVER_PIN and ADMIN_PASSWORD keep their current
      # values, because they are set on the worker and not in wrangler.jsonc.
      - name: Confirm the site is answering
        run: |
          set -e
          sleep 5
          for path in / /tradeplate/ /privacy /photoai/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://rsmotocons.com$path")
            echo "$path -> $code"
            case "$code" in
              200|302|303|307) ;;
              # Cloudflare's bot protection challenges GitHub's runners, so a
              # 403 here says nothing about the deploy. Warn, don't fail.
              403) echo "::warning::$path returned 403 to the runner (bot protection); check it in a browser" ;;
              *) echo "Unexpected status for $path"; exit 1 ;;
            esac
          done
