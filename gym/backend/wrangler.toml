name = "recomp"
main = "backend/worker.js"
compatibility_date = "2026-01-01"

# Static PWA served from the same origin as the API. This matters: the session
# cookie is SameSite=Lax and mutations carry a same-origin check.
[assets]
directory = "./"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "recomp"
database_id = "replace-with-your-d1-id"

# Secrets are NOT set here. Use:
#   wrangler secret put OWNER_EMAIL
#   wrangler secret put BOOTSTRAP_OWNER_PASSWORD
#
# Optional, for sign-up email and the AI weekly review (none are set by default):
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY
# Plain variables such as MAIL_FROM, PUBLIC_URL and AI_MODEL may go under [vars].
